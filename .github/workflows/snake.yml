name: Atualizar Snake

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: snake-output
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Gerar animações
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23B85C88&color_dots=%23F3EDF1,%23F1D5E2,%23E5ACC6,%23CE7FA5,%23A94D7C
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23F3C4D7&color_dots=%23211C27,%23493044,%23764A68,%23AD6B90,%23DCA0BB
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagens
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
